<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moon-slice playground</title>
<style>
:root{--bg:#0f1115;--panel:#151922;--line:#2b2f3a;--text:#d7dae0;--muted:#9aa0a6;--accent:#ffb74d;--blue:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace}
header{display:flex;align-items:baseline;gap:1rem;padding:1.2rem 1.5rem;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.1rem}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:.85rem}
main{display:grid;grid-template-columns:minmax(360px,42%) 1fr;gap:1rem;padding:1rem 1.5rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem}
label{display:block;color:var(--muted);font-size:.8rem;margin:.2rem 0 .35rem}
textarea{width:100%;height:46vh;resize:vertical;background:#0b0e13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.7rem;font:inherit;font-size:.85rem;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin-top:.7rem}
.controls input,.controls select{background:#0b0e13;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;font:inherit}
.controls input[type=number]{width:6rem}
button{background:var(--accent);color:#1b1200;border:0;border-radius:6px;padding:.5rem .9rem;font:inherit;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
.hint{color:var(--muted);font-size:.78rem;margin:.6rem 0 0;line-height:1.5}
.right{display:flex;flex-direction:column;gap:.5rem}
.status{color:var(--muted);font-size:.78rem}
iframe{width:100%;height:78vh;border:0;border-radius:8px;background:#0f1115}
@media(max-width:900px){main{grid-template-columns:1fr}textarea{height:34vh}iframe{height:60vh}}
</style>
</head>
<body>
<header>
  <h1>moon-slice <span>playground</span></h1>
  <p>MoonBit → CFG → def-use → CDG → PDG → slice, compiled to JavaScript. No server.</p>
</header>
<main>
  <section class="left">
    <label for="source">MoonBit source</label>
    <textarea id="source" spellcheck="false">// EXPECT-BACKWARD 7 -> [4, 5, 6, 7, 8]
// EXPECT-FORWARD 7 -> [7, 10]
fn loop_sum(n : Int) -> Int {
  let mut i = 0
  let mut total = 0
  while i < n {
    total = total + i // target
    i = i + 1
  }
  return total
}
</textarea>
    <div class="controls">
      <label>Line <input id="line" type="number" value="7" min="1"></label>
      <label>Direction
        <select id="direction">
          <option value="backward">backward</option>
          <option value="forward">forward</option>
          <option value="interprocedural">interprocedural (backward)</option>
        </select>
      </label>
      <button id="run">Slice</button>
    </div>
    <p class="hint">Target a statement line. Backward answers “where did this value come from?”, forward answers “what does this value affect?”, interprocedural expands callee return-value cones.</p>
  </section>
  <section class="right">
    <div class="status" id="status">loading engine…</div>
    <iframe id="out" title="moon-slice report"></iframe>
  </section>
</main>
<script>
  globalThis.moonSliceReadInput = () => [
    document.getElementById('direction').value,
    document.getElementById('line').value,
    document.getElementById('source').value,
  ].join('@@MOONSLICE@@');

  globalThis.moonSliceWriteOutput = (html) => {
    document.getElementById('out').srcdoc = html;
    document.getElementById('status').textContent = 'rendered ' + html.length + ' bytes';
  };

  function run() {
    const old = document.getElementById('engine');
    if (old) old.remove();
    document.getElementById('status').textContent = 'running…';
    const s = document.createElement('script');
    s.id = 'engine';
    s.src = 'moon-slice.js?t=' + Date.now();
    s.onerror = () => {
      document.getElementById('status').textContent = 'failed to load moon-slice.js — run bash web/build.sh';
    };
    document.body.appendChild(s);
  }

  document.getElementById('run').addEventListener('click', run);
  window.addEventListener('DOMContentLoaded', run);
</script>
</body>
</html>
