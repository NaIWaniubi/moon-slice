name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry index
        run: moon update

      # Byte equality with the committed bundle is not checkable across
      # platforms: MoonBit's JS backend numbers internal symbols in an order
      # that differs between Windows and Linux, so the artifacts are
      # functionally identical but textually different. Verify both functionally.
      - name: Smoke the committed bundle
        run: node web/smoke.mjs

      - name: Build browser engine
        run: bash web/build.sh

      - name: Smoke the rebuilt bundle
        run: node web/smoke.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
