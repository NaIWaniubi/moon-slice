name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check

      - name: Build CLI (native release)
        run: moon build --target native --release cmd/main

      - name: Test
        run: moon test

      - name: Verify example corpus
        run: bash testdata/verify_corpus.sh

      - name: CLI smoke
        run: bash test/cli_smoke.sh

      # The committed bundle must still be a build of the current sources. Byte
      # equality is not checkable here: MoonBit's JS backend numbers internal
      # symbols in an order that differs between platforms, so a Windows-built
      # bundle and a Linux-built one are functionally identical but textually
      # different. The check is therefore functional on both artifacts:
      #
      #   1. smoke-test the committed bundle as-is;
      #   2. rebuild from source, and smoke-test the rebuild.
      #
      # If a source change was not accompanied by a rebuilt bundle, step 1 fails
      # against the stale artifact's behaviour; if the rebuild itself is broken,
      # step 2 fails.
      - name: Smoke the committed bundle
        run: node web/smoke.mjs

      - name: Build browser engine
        run: bash web/build.sh

      - name: Smoke the rebuilt bundle
        run: node web/smoke.mjs

  # Exercise action.yml the way a consumer does: GitHub resolves the composite
  # action, the action installs MoonBit, builds the pinned source, and scans a
  # tree. `src/` has no findings, so the --fail-on-findings gate stays green.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          command: dead
          args: --dir src --fail-on-findings
