name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Verify example corpus
        run: bash testdata/verify_corpus.sh

      - name: Web playground smoke
        run: node web/smoke.mjs
